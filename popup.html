<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Coach</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 400px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }
        
        .container {
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 12px;
            opacity: 0.9;
        }
        
        .score-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .score-title {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .score-display {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .score-value {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
        }
        
        .score-emoji {
            font-size: 48px;
        }
        
        .score-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .score-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        
        .score-message {
            font-size: 14px;
            color: #333;
            font-weight: 600;
        }
        
        .feedback {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            line-height: 1.4;
        }
        
        .category-stats {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .category-stats h3 {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .stat-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        .stat-label {
            font-size: 13px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stat-icon {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        .stat-value {
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }
        
        .productive-icon { background: #4CAF50; color: white; }
        .social-icon { background: #FF9800; color: white; }
        .video-icon { background: #2196F3; color: white; }
        .neutral-icon { background: #9C27B0; color: white; }
        .ecommerce-icon { background: #F44336; color: white; }
        
        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .btn-primary:hover {
            background: #667eea;
            color: white;
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
        }
        
        .btn-secondary:hover {
            background: white;
            color: #667eea;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: white;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Focus Coach</h1>
            <p>Real-time distraction detector</p>
        </div>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading your focus data...</p>
        </div>
        
        <div id="content" style="display: none;">
            <!-- Hourly Score -->
            <div class="score-card">
                <div class="score-title">⏰ This Hour</div>
                <div class="score-display">
                    <div class="score-emoji" id="hourlyEmoji">🎯</div>
                    <div class="score-value" id="hourlyScore">--</div>
                </div>
                <div class="score-bar">
                    <div class="score-bar-fill" id="hourlyBar" style="width: 50%"></div>
                </div>
                <div class="score-message" id="hourlyMessage">Loading...</div>
                <div class="feedback" id="hourlyFeedback"></div>
            </div>
            
            <!-- Daily Score -->
            <div class="score-card">
                <div class="score-title">📊 Today</div>
                <div class="score-display">
                    <div class="score-emoji" id="dailyEmoji">🎯</div>
                    <div class="score-value" id="dailyScore">--</div>
                </div>
                <div class="score-bar">
                    <div class="score-bar-fill" id="dailyBar" style="width: 50%"></div>
                </div>
                <div class="score-message" id="dailyMessage">Loading...</div>
                <div class="feedback" id="dailyFeedback"></div>
            </div>
            
            <!-- Category Stats -->
            <div class="category-stats">
                <h3>📈 Time by Category</h3>
                <div class="stat-item">
                    <span class="stat-label">
                        <span class="stat-icon productive-icon">✓</span>
                        Productive
                    </span>
                    <span class="stat-value" id="stat-productive">0m</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">
                        <span class="stat-icon neutral-icon">📧</span>
                        Neutral
                    </span>
                    <span class="stat-value" id="stat-neutral">0m</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">
                        <span class="stat-icon ecommerce-icon">🛍️</span>
                        E-Commerce
                    </span>
                    <span class="stat-value" id="stat-ecommerce">0m</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">
                        <span class="stat-icon video-icon">▶️</span>
                        Video
                    </span>
                    <span class="stat-value" id="stat-video">0m</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">
                        <span class="stat-icon social-icon">📱</span>
                        Social Media
                    </span>
                    <span class="stat-value" id="stat-social">0m</span>
                </div>
            </div>
            
            <div class="actions">
                <button class="btn-primary" id="refreshBtn">🔄 Refresh</button>
                <button class="btn-secondary" id="dashboardBtn">📊 Full Report</button>
            </div>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
